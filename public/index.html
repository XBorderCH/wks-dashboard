<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>Kundendatenbank</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#F6F8F7;
    --surface:#FFFFFF;
    --ink:#16211E;
    --ink-soft:#5B6D67;
    --line:#DDE5E1;
    --accent:#0E6E5D;
    --accent-soft:#E3EFEB;
    --accent-ink:#08453A;
    --amber:#B4700C;
    --amber-soft:#FBF0DD;
    --red:#B23B2E;
    --red-soft:#FBEAE7;
    --radius:10px;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg);
    color:var(--ink);
    font-family:'IBM Plex Sans', sans-serif;
    -webkit-font-smoothing:antialiased;
    min-height:100vh;
  }
  .mono{font-family:'IBM Plex Mono', monospace;}
  ::selection{background:var(--accent-soft);}

  /* ---- Login ---- */
  #login-screen{
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:24px;
  }
  .login-card{
    background:var(--surface);
    border:1px solid var(--line);
    border-radius:var(--radius);
    padding:40px 36px;
    width:100%;
    max-width:360px;
    box-shadow:0 1px 2px rgba(20,30,26,0.04);
  }
  .login-card .brand{
    display:flex;
    align-items:center;
    gap:10px;
    margin-bottom:28px;
  }
  .brand-mark{
    width:36px;height:36px;
    border-radius:8px;
    background:#EDEEED;
    display:flex;align-items:center;justify-content:center;
    flex:none;
    padding:5px;
  }
  .brand-mark img{width:100%;height:100%;object-fit:contain;display:block;}
  .brand-text{font-weight:600;font-size:16px;letter-spacing:-0.01em;}
  .login-card label{
    display:block;font-size:12.5px;color:var(--ink-soft);margin-bottom:6px;font-weight:500;
    text-transform:uppercase;letter-spacing:0.04em;
  }
  .login-card input{
    width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:8px;
    font-size:16px;font-family:inherit;background:#FCFDFC;
  }
  .login-card input:focus{outline:2px solid var(--accent);outline-offset:1px;border-color:var(--accent);}
  .login-card button{
    margin-top:16px;width:100%;padding:11px;border:none;border-radius:8px;
    background:var(--accent);color:#fff;font-weight:600;font-size:14.5px;cursor:pointer;
    font-family:inherit;
  }
  .login-card button:hover{background:var(--accent-ink);}
  .login-error{color:var(--red);font-size:13px;margin-top:10px;min-height:16px;}

  /* ---- App shell ---- */
  #app{display:none;min-height:100vh;flex-direction:column;}
  header.topbar{
    background:var(--surface);
    border-bottom:1px solid var(--line);
    padding:14px 22px;
    display:flex;align-items:center;gap:16px;
    position:sticky;top:0;z-index:10;
  }
  header.topbar .brand{display:flex;align-items:center;gap:10px;flex:none;}
  .search-wrap{flex:1;position:relative;max-width:560px;}
  .search-wrap input{
    width:100%;padding:10px 14px 10px 38px;border:1px solid var(--line);border-radius:8px;
    font-size:16px;font-family:inherit;background:var(--bg);
  }
  .search-wrap input:focus{outline:2px solid var(--accent);outline-offset:1px;background:#fff;}
  .search-wrap .icon{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--ink-soft);font-size:15px;}
  .meta-count{font-size:12.5px;color:var(--ink-soft);white-space:nowrap;}
  .logout-btn{
    margin-left:auto;background:none;border:1px solid var(--line);border-radius:7px;
    padding:7px 12px;font-size:13px;color:var(--ink-soft);cursor:pointer;font-family:inherit;
  }
  .logout-btn:hover{background:var(--bg);}

  main{flex:1;display:flex;overflow:hidden;}

  /* ---- Results panel ---- */
  #results-panel{
    width:340px;flex:none;border-right:1px solid var(--line);
    overflow-y:auto;background:var(--surface);
  }
  .hint{padding:26px 20px;color:var(--ink-soft);font-size:13.5px;line-height:1.6;}
  .result-item{
    padding:13px 20px;border-bottom:1px solid var(--line);cursor:pointer;
  }
  .result-item:hover{background:var(--accent-soft);}
  .result-item.active{background:var(--accent-soft);border-left:3px solid var(--accent);padding-left:17px;}
  .result-kdnr{font-family:'IBM Plex Mono',monospace;font-size:11.5px;color:var(--accent-ink);font-weight:600;}
  .result-name{font-size:14.5px;font-weight:500;margin-top:2px;}
  .result-ort{font-size:12.5px;color:var(--ink-soft);margin-top:1px;}

  /* ---- Detail panel ---- */
  #detail-panel{flex:1;overflow-y:auto;padding:20px 18px 60px;}
  .empty-state{
    height:100%;display:flex;align-items:center;justify-content:center;
    color:var(--ink-soft);font-size:14.5px;text-align:center;flex-direction:column;gap:8px;
  }
  .empty-state .big{font-size:32px;}

  .detail-header{
    display:flex;align-items:flex-start;justify-content:space-between;flex-wrap:wrap;gap:14px;
    margin-bottom:22px;
  }
  .kdnr-badge{
    display:inline-block;font-family:'IBM Plex Mono',monospace;font-size:12px;font-weight:600;
    background:var(--accent-ink);color:#fff;padding:3px 8px;border-radius:5px;letter-spacing:0.02em;
  }
  .detail-title{font-size:22px;font-weight:600;letter-spacing:-0.01em;margin:8px 0 4px;}
  .detail-sub{color:var(--ink-soft);font-size:14px;}
  .chip{
    display:inline-flex;align-items:center;gap:6px;padding:6px 12px;border-radius:20px;
    font-size:12.5px;font-weight:600;
  }
  .chip.ok{background:var(--accent-soft);color:var(--accent-ink);}
  .chip.warn{background:var(--amber-soft);color:var(--amber);}
  .chip .dot{width:6px;height:6px;border-radius:50%;background:currentColor;}
  .chip-clickable{border:none;cursor:pointer;font-family:inherit;}
  .chip-clickable:hover{filter:brightness(0.95);}
  .chip-clickable:active{filter:brightness(0.9);}

  /* ---- Tagestour-Modal ---- */
  #tagestour-overlay, #tage-overlay{
    display:none;position:fixed;inset:0;background:rgba(20,30,26,0.45);z-index:100;
    align-items:center;justify-content:center;padding:20px;
  }
  #tagestour-overlay.open, #tage-overlay.open{display:flex;}
  .modal-card{
    background:var(--surface);border-radius:12px;max-width:440px;width:100%;
    max-height:80vh;overflow-y:auto;box-shadow:0 8px 30px rgba(20,30,26,0.2);
  }
  .modal-header{
    display:flex;align-items:center;justify-content:space-between;
    padding:16px 20px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--surface);
  }
  .modal-header h3{margin:0;font-size:15px;font-weight:600;}
  .modal-close{background:none;border:none;font-size:20px;cursor:pointer;color:var(--ink-soft);line-height:1;padding:4px;}
  .modal-close:hover{color:var(--ink);}
  .modal-body{padding:8px 12px 16px;}
  .tour-item{
    display:flex;align-items:center;gap:12px;padding:12px 10px;border-radius:8px;cursor:pointer;
  }
  .tour-item:hover{background:var(--bg);}
  .tour-item.self{background:var(--accent-soft);}
  .tour-item .tour-zeit{
    font-family:'IBM Plex Mono',monospace;font-weight:600;font-size:13.5px;color:var(--accent-ink);
    flex:none;min-width:52px;
  }
  .tour-item .tour-info{flex:1;min-width:0;}
  .tour-item .tour-name{font-size:14.5px;font-weight:500;}
  .tour-item .tour-ort{font-size:12.5px;color:var(--ink-soft);}
  .tour-item .tour-fahrer{
    font-size:10.5px;font-weight:600;text-transform:uppercase;letter-spacing:0.03em;
    padding:3px 8px;border-radius:20px;flex:none;
  }
  .tour-item .tour-fahrer.ralph{background:#E4EBFB;color:#2A4BA0;}
  .tour-item .tour-fahrer.kathrin{background:#E1F0EA;color:#1D7A50;}
  .tour-item .tour-badge{
    font-size:10.5px;font-weight:600;text-transform:uppercase;letter-spacing:0.03em;
    color:var(--accent-ink);flex:none;
  }
  .modal-empty{padding:24px 20px;text-align:center;color:var(--ink-soft);font-size:13.5px;}

  /* ---- Logo-Dropdown-Menü ---- */
  .logo-menu-wrap{position:relative;}
  .logo-btn{cursor:pointer;border:none;}
  .logo-menu{
    display:none;position:absolute;top:calc(100% + 8px);left:0;z-index:50;
    background:var(--surface);border:1px solid var(--line);border-radius:10px;
    box-shadow:0 6px 20px rgba(20,30,26,0.12);min-width:200px;overflow:hidden;padding:6px;
  }
  .logo-menu.open{display:block;}
  .logo-menu-item{
    display:flex;align-items:center;gap:10px;width:100%;padding:10px 12px;border:none;
    background:none;cursor:pointer;font-family:inherit;font-size:14px;color:var(--ink);
    border-radius:7px;text-align:left;
  }
  .logo-menu-item:hover{background:var(--bg);}
  .lmi-icon{font-size:15px;flex:none;}

  /* ---- Einsatztage-Modal ---- */
  .tage-section-title{
    font-size:11px;text-transform:uppercase;letter-spacing:0.05em;font-weight:600;
    color:var(--ink-soft);padding:14px 10px 6px;
  }
  .tage-summary{
    margin-top:8px;padding:14px 10px;border-top:1px solid var(--line);
    font-size:14px;color:var(--ink-soft);
  }
  .tage-summary strong{color:var(--ink);font-weight:700;}
  .route-summary{
    margin-top:8px;padding:14px 10px;border-top:1px solid var(--line);
    font-size:14px;color:var(--ink-soft);
  }
  .route-summary strong{color:var(--ink);font-weight:700;}
  .route-hinweis{font-size:12px;}
  .tage-item{
    display:grid;grid-template-columns:1fr 60px 76px;align-items:center;gap:10px;
    padding:11px 10px;border-radius:8px;cursor:pointer;
  }
  .tage-item:hover{background:var(--bg);}
  .tage-item .tage-datum{font-size:14.5px;font-weight:500;}
  .tage-item .tage-count{font-size:12px;color:var(--ink-soft);text-align:right;}
  .tage-fahrer-group{display:flex;gap:5px;justify-self:start;}
  .tage-fahrer{
    width:22px;height:22px;flex:none;
    display:inline-flex;align-items:center;justify-content:center;
    font-size:11px;font-weight:700;border-radius:50%;
  }
  .tage-fahrer.r{background:#E4EBFB;color:#2A4BA0;}
  .tage-fahrer.k{background:#E1F0EA;color:#1D7A50;}
  .fahrer-choice{display:flex;gap:10px;padding:14px 10px;}
  .fahrer-btn{
    flex:1;padding:14px;border:1px solid var(--line);border-radius:9px;background:var(--surface);
    cursor:pointer;font-family:inherit;font-size:14.5px;font-weight:600;color:var(--ink);
    text-align:center;
  }
  .fahrer-btn:hover{background:var(--bg);border-color:var(--accent);}
  .fahrer-btn.r{background:#E4EBFB;border-color:#E4EBFB;color:#2A4BA0;}
  .fahrer-btn.r:hover{border-color:#2A4BA0;}
  .fahrer-btn.k{background:#E1F0EA;border-color:#E1F0EA;color:#1D7A50;}
  .fahrer-btn.k:hover{border-color:#1D7A50;}
  .fahrer-back{
    display:inline-flex;align-items:center;gap:6px;background:none;border:none;color:var(--ink-soft);
    font-size:13px;cursor:pointer;font-family:inherit;padding:10px;
  }

  .grid{
    display:grid;grid-template-columns:repeat(auto-fit, minmax(280px,1fr));gap:12px;margin-bottom:12px;
  }
  .card{
    background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);
    padding:14px 16px;
  }
  .card h3{
    margin:0 0 14px;font-size:12px;text-transform:uppercase;letter-spacing:0.06em;
    color:var(--ink-soft);font-weight:600;
  }
  .kv{display:flex;justify-content:space-between;gap:10px;padding:7px 0;font-size:15px;border-bottom:1px solid #F0F3F1;}
  .kv:last-child{border-bottom:none;}
  .kv .k{color:var(--ink-soft);flex:none;}
  .kv .v{text-align:right;font-weight:500;}
  .kv .v.mono{font-family:'IBM Plex Mono',monospace;font-weight:500;}
  .kv .v.link{color:var(--accent-ink);text-decoration:none;}
  .kv .v.link:hover{text-decoration:underline;}
  .kv .v.link:active{opacity:0.7;}

  .tabs{display:flex;gap:4px;margin-bottom:14px;flex-wrap:wrap;}
  .tab-btn{
    background:var(--bg);border:1px solid var(--line);border-radius:7px;padding:6px 12px;
    font-size:12.5px;font-weight:500;cursor:pointer;color:var(--ink-soft);font-family:inherit;
  }
  .tab-btn.active{background:var(--accent);border-color:var(--accent);color:#fff;}

  .timeline{list-style:none;margin:0;padding:0;}
  .timeline li{
    display:flex;align-items:center;gap:12px;padding:9px 0;border-bottom:1px solid #F0F3F1;font-size:15px;
  }
  .timeline li:last-child{border-bottom:none;}
  .timeline .tdot{width:7px;height:7px;border-radius:50%;background:var(--accent);flex:none;}
  .timeline .tlabel{color:var(--ink-soft);flex:1;}
  .timeline .tval{font-family:'IBM Plex Mono',monospace;font-weight:500;}

  table.fee-table{width:100%;border-collapse:collapse;font-size:13.5px;}
  table.fee-table th{
    text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:0.04em;
    color:var(--ink-soft);font-weight:600;padding:6px 8px;border-bottom:1px solid var(--line);
  }
  table.fee-table td{padding:8px 8px;border-bottom:1px solid #F0F3F1;}
  table.fee-table td.mono{font-family:'IBM Plex Mono',monospace;}

  .remark{padding:9px 0;border-bottom:1px solid #F0F3F1;font-size:14.5px;line-height:1.5;}
  .remark:last-child{border-bottom:none;}
  .remark .rlabel{font-size:11px;text-transform:uppercase;letter-spacing:0.04em;color:var(--ink-soft);margin-bottom:3px;font-weight:600;}

  details.raw{margin-top:6px;}
  details.raw summary{
    cursor:pointer;font-size:12.5px;color:var(--ink-soft);padding:8px 0;user-select:none;
  }
  .raw-grid{
    display:grid;grid-template-columns:repeat(auto-fill, minmax(220px,1fr));gap:1px;
    background:var(--line);border:1px solid var(--line);border-radius:8px;overflow:hidden;margin-top:8px;
  }
  .raw-cell{background:var(--surface);padding:8px 10px;font-size:12px;}
  .raw-cell .rk{color:var(--ink-soft);font-family:'IBM Plex Mono',monospace;font-size:10.5px;display:block;margin-bottom:2px;}
  .raw-cell .rv{word-break:break-word;}

  @media (max-width: 760px){
    #results-panel{width:100%;position:absolute;inset:0;z-index:5;}
    #results-panel.hidden-mobile{display:none;}
    #detail-panel{padding:16px 12px 60px;}
    .grid{grid-template-columns:1fr;gap:10px;}
    header.topbar{padding:10px 12px;gap:10px;}
    main{position:relative;}
    .back-btn{display:inline-flex;margin-bottom:14px;background:none;border:1px solid var(--line);border-radius:7px;padding:6px 12px;font-size:13px;cursor:pointer;color:var(--ink-soft);font-family:inherit;}
  }
  .back-btn{display:none;}
</style>
</head>
<body>

<div id="login-screen">
  <div class="login-card">
    <div class="brand">
      <div class="brand-mark"><img src="/tropfen-icon.png" alt="WKS" /></div>
      <div class="brand-text">Kundendatenbank</div>
    </div>
    <form id="login-form">
      <label for="pw">Passwort</label>
      <input type="password" id="pw" autocomplete="current-password" autofocus />
      <button type="submit">Anmelden</button>
      <div class="login-error" id="login-error"></div>
    </form>
  </div>
</div>

<div id="app">
  <header class="topbar">
    <div class="brand logo-menu-wrap">
      <button type="button" class="brand-mark logo-btn" id="logo-btn"><img src="/tropfen-icon.png" alt="WKS" /></button>
      <div class="logo-menu" id="logo-menu">
        <button type="button" class="logo-menu-item" data-menu="einsatztage">
          <span>Einsatztage</span>
        </button>
      </div>
    </div>
    <div class="search-wrap">
      <span class="icon">&#9906;</span>
      <input type="text" id="search-input" placeholder="Kundennummer oder Nachname suchen..." autocomplete="off" />
    </div>
    <div class="meta-count" id="meta-count"></div>
    <button class="logout-btn" id="logout-btn">Abmelden</button>
  </header>
  <main>
    <div id="results-panel">
      <div class="hint" id="results-hint">Tippen, um nach Kundennummer oder Nachname zu suchen.</div>
      <div id="results-list"></div>
    </div>
    <div id="detail-panel">
      <div class="empty-state">
        <div class="big">&#9906;</div>
        <div>Kein Kunde ausgewählt</div>
      </div>
    </div>
  </main>
</div>

<div id="tagestour-overlay">
  <div class="modal-card">
    <div class="modal-header">
      <h3 id="tagestour-title">Tagestour</h3>
      <button class="modal-close" id="tagestour-close">&times;</button>
    </div>
    <div class="modal-body" id="tagestour-body"></div>
  </div>
</div>

<div id="tage-overlay">
  <div class="modal-card">
    <div class="modal-header">
      <h3 id="tage-title">Einsatztage</h3>
      <button class="modal-close" id="tage-close">&times;</button>
    </div>
    <div class="modal-body" id="tage-body"></div>
  </div>
</div>

<script>
const $ = (sel) => document.querySelector(sel);

async function checkSession(){
  const r = await fetch('/api/session');
  const d = await r.json();
  if(d.authed){
    showApp();
  }
}

function showApp(){
  $('#login-screen').style.display = 'none';
  $('#app').style.display = 'flex';
  loadMeta();
  $('#search-input').focus();
}

$('#login-form').addEventListener('submit', async (e) => {
  e.preventDefault();
  const password = $('#pw').value;
  $('#login-error').textContent = '';
  try{
    const r = await fetch('/api/login', {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({password})
    });
    const d = await r.json();
    if(d.ok){ showApp(); }
    else { $('#login-error').textContent = 'Falsches Passwort.'; }
  }catch(err){
    $('#login-error').textContent = 'Verbindungsfehler.';
  }
});

$('#logout-btn').addEventListener('click', async () => {
  await fetch('/api/logout', {method:'POST'});
  location.reload();
});

async function loadMeta(){
  const r = await fetch('/api/meta');
  if(!r.ok) return;
  const d = await r.json();
  $('#meta-count').textContent = d.anzahl + ' Kunden';
}

let searchTimer = null;
$('#search-input').addEventListener('input', (e) => {
  clearTimeout(searchTimer);
  // Sobald wieder getippt wird, Ergebnis-Panel auf Mobile wieder einblenden
  $('#results-panel').classList.remove('hidden-mobile');
  const q = e.target.value.trim();
  searchTimer = setTimeout(() => runSearch(q), 150);
});
$('#search-input').addEventListener('focus', () => {
  $('#results-panel').classList.remove('hidden-mobile');
});

let activeKdnr = null;

async function runSearch(q){
  const listEl = $('#results-list');
  const hintEl = $('#results-hint');
  if(!q){
    listEl.innerHTML = '';
    hintEl.style.display = 'block';
    hintEl.textContent = 'Tippen, um nach Kundennummer oder Nachname zu suchen.';
    return;
  }
  const r = await fetch('/api/kunden?q=' + encodeURIComponent(q));
  const results = await r.json();
  hintEl.style.display = results.length ? 'none' : 'block';
  if(!results.length){
    hintEl.textContent = 'Keine Treffer für "' + q + '".';
  }
  listEl.innerHTML = results.map(k => `
    <div class="result-item ${k.kdnr===activeKdnr?'active':''}" data-kdnr="${k.kdnr}">
      <div class="result-kdnr">#${escapeHtml(k.kdnr||'-')}</div>
      <div class="result-name">${escapeHtml(k.kdnrName || '(ohne Name)')}</div>
      <div class="result-ort">${escapeHtml([k.anlagentyp,k.ort].filter(Boolean).join(' · '))}</div>
    </div>
  `).join('');
  listEl.querySelectorAll('.result-item').forEach(el => {
    el.addEventListener('click', () => openKunde(el.dataset.kdnr));
  });
}

function escapeHtml(s){
  if(s===null||s===undefined) return '';
  return String(s).replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
}

async function openKunde(kdnr){
  activeKdnr = kdnr;
  document.querySelectorAll('.result-item').forEach(el => {
    el.classList.toggle('active', el.dataset.kdnr === kdnr);
  });
  if(window.innerWidth <= 760){
    $('#results-panel').classList.add('hidden-mobile');
  }
  const r = await fetch('/api/kunden/' + encodeURIComponent(kdnr));
  if(!r.ok){ return; }
  const k = await r.json();
  renderDetail(k);
}

function fmtChf(v){
  if(v===null||v===undefined||v==='') return null;
  const n = String(v).replace(',', '.');
  if(/^-?\d+(\.\d+)?$/.test(n)) return 'CHF ' + Number(n).toFixed(2);
  return String(v);
}

// "N47.45495° E7.58525°" -> Google-Maps-Link
function koordinatenLink(v){
  if(!v) return null;
  const m = String(v).match(/([NS])\s*([\d.]+)\D*([EW])\s*([\d.]+)/i);
  if(!m) return null;
  let lat = parseFloat(m[2]);
  let lon = parseFloat(m[4]);
  if(/S/i.test(m[1])) lat = -lat;
  if(/W/i.test(m[3])) lon = -lon;
  if(isNaN(lat) || isNaN(lon)) return null;
  return `https://www.google.com/maps?q=${lat},${lon}`;
}

function telHref(v){
  if(!v) return null;
  const digits = String(v).replace(/[^\d+]/g,'');
  if(!digits) return null;
  return 'tel:' + digits;
}

function mailtoHref(v){
  if(!v) return null;
  const email = String(v).trim();
  if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) return null;
  return 'mailto:' + email;
}

// Freitext-Adresse -> Google-Maps-Suchlink
function adresseLink(v){
  if(!v) return null;
  return 'https://www.google.com/maps/search/?api=1&query=' + encodeURIComponent(v);
}
function formatZeit(v){
  if(v===null||v===undefined||v==='') return null;
  const digits = String(v).trim().replace(/[^\d]/g,'');
  if(!digits) return String(v);
  const padded = digits.padStart(4,'0');
  return padded.slice(0,2) + ':' + padded.slice(2,4);
}

// "30.07.2026" -> "30.07"
function formatDatumKurz(v){
  if(!v) return null;
  const parts = String(v).split('.');
  if(parts.length < 2) return v;
  return parts[0] + '.' + parts[1];
}

function formatDatumJahr(v){
  if(!v) return null;
  const parts = String(v).split('.');
  return parts.length === 3 ? parts[2] : null;
}

// "30.07.2026" -> Date-Objekt (Mitternacht)
function parseDatum(v){
  if(!v) return null;
  const m = String(v).match(/^(\d{1,2})\.(\d{1,2})\.(\d{4})$/);
  if(!m) return null;
  return new Date(Number(m[3]), Number(m[2])-1, Number(m[1]));
}

// Datum + Zeit zusammen hübsch formatiert: "30.07, 13:30 Uhr"
function combinedDatumZeit(datum, zeit){
  const d = formatDatumKurz(datum);
  const z = formatZeit(zeit);
  if(d && z) return `${d}, ${z} Uhr`;
  if(d) return d;
  if(z) return z + ' Uhr';
  return null;
}

function contactRows(c){
  const nameLine = [c.titel, c.vorname, c.name].filter(Boolean).join(' ') || c.name || null;
  return [
    ['Name', nameLine],
    ['Abteilung', c.abteilung],
    ['Adresse', [c.strasse, [c.plz, c.ort].filter(Boolean).join(' ')].filter(Boolean).join(', ') || null],
    ['Natel', c.natel],
    ['Telefon', c.tel],
    ['E-Mail', c.mail],
  ].filter(([,v]) => v);
}

function contactTabBody(tabKey, c){
  if(!c) return '<div class="kv"><span class="k">Keine Angaben</span></div>';
  let rows = contactRows(c);
  let extraHtml = '';

  if(tabKey === 'rechnung'){
    const rechnungen = c.rechnungen || [];
    if(rechnungen.length){
      extraHtml += `
        <table class="fee-table" style="margin-top:10px;">
          <thead><tr><th>Jahr</th><th>Rechnungs-Nr.</th><th>Betrag</th></tr></thead>
          <tbody>
            ${rechnungen.map(g => `<tr><td>${escapeHtml(g.jahr)}</td><td class="mono">${escapeHtml(g.rechnungsNr||'—')}</td><td class="mono">${escapeHtml(fmtChf(g.betrag)||'—')}</td></tr>`).join('')}
          </tbody>
        </table>`;
    }
    const feeBits = [
      c.aktuelleGebuehr ? `<div class="kv"><span class="k">Wartungsgebühr (aktuell)</span><span class="v mono">${escapeHtml(fmtChf(c.aktuelleGebuehr))}</span></div>` : '',
      c.wartOffen ? `<div class="kv"><span class="k">Wartung offen</span><span class="v">${escapeHtml(c.wartOffen)}</span></div>` : '',
    ].join('');
    if(feeBits) extraHtml += `<div style="margin-top:10px;border-top:1px solid var(--line);padding-top:8px;">${feeBits}</div>`;
  }

  if(tabKey === 'avisierung'){
    const bits = [
      ['Avisierung Papier', c.avisPapier],
      ['Avisierung Mail', c.avisMail],
      ['Zeitfenster Avis', c.zeitAvis],
      ['Avis nächster Service', c.avisNaechsterService],
    ].filter(([,v]) => v);
    if(bits.length){
      extraHtml += `<div style="margin-top:10px;border-top:1px solid var(--line);padding-top:8px;">${bits.map(([k,v]) => `<div class="kv"><span class="k">${k}</span><span class="v">${escapeHtml(v)}</span></div>`).join('')}</div>`;
    }
  }

  const rowsHtml = rows.length
    ? rows.map(([k,v]) => {
        if((k === 'Natel' || k === 'Telefon') && telHref(v)){
          return `<div class="kv"><span class="k">${k}</span><a class="v link" href="${telHref(v)}">${escapeHtml(v)}</a></div>`;
        }
        if(k === 'E-Mail' && mailtoHref(v)){
          return `<div class="kv"><span class="k">${k}</span><a class="v link" href="${mailtoHref(v)}">${escapeHtml(v)}</a></div>`;
        }
        if(k === 'Adresse' && adresseLink(v)){
          return `<div class="kv"><span class="k">${k}</span><a class="v link" href="${adresseLink(v)}" target="_blank" rel="noopener">${escapeHtml(v)}</a></div>`;
        }
        return `<div class="kv"><span class="k">${k}</span><span class="v">${escapeHtml(v)}</span></div>`;
      }).join('')
    : '<div class="kv"><span class="k">Keine Kontaktdaten</span></div>';

  return rowsHtml + extraHtml;
}

function renderDetail(k){
  const a = k.anlage || {};
  const naechsterTermin = (k.termine||[])
    .map(t => ({...t, _d: parseDatum(t.datum)}))
    .filter(t => t._d && t._d.getTime() >= new Date(new Date().setHours(0,0,0,0)).getTime())
    .sort((a,b) => a._d - b._d)[0];
  const chip = naechsterTermin
    ? `<button type="button" class="chip warn chip-clickable" id="chip-tagestour" data-datum="${escapeHtml(naechsterTermin.datum)}" data-fahrer="${escapeHtml((k.planung && k.planung.fahrer) || '')}"><span class="dot"></span>Nächster Service: ${escapeHtml(combinedDatumZeit(naechsterTermin.datum, naechsterTermin.zeit))}</button>`
    : `<span class="chip ok"><span class="dot"></span>Kein Termin geplant</span>`;

  const backBtn = `<button class="back-btn" onclick="document.getElementById('results-panel').classList.remove('hidden-mobile')">&larr; Zur Suche</button>`;

  const header = `
    ${backBtn}
    <div class="detail-header">
      <div>
        <span class="kdnr-badge mono">#${escapeHtml(k.kdnr||'—')}</span>
        <div class="detail-title">${escapeHtml(k.kdnrName || '(ohne Name)')}</div>
        <div class="detail-sub">${escapeHtml([a.anlagentyp, [a.adresse, [a.plz, a.ort].filter(Boolean).join(' ')].filter(Boolean).join(', ')].filter(Boolean).join(' · '))}</div>
      </div>
      ${chip}
    </div>
  `;

  const anlageCard = `
    <div class="card">
      <h3>Anlage &amp; Adresse</h3>
      ${kvLink('Adresse', a.adresse, adresseLink([a.adresse, a.plz, a.ort].filter(Boolean).join(', ')))}
      ${kv('PLZ / Ort', [a.plz, a.ort].filter(Boolean).join(' '))}
      ${kvLink('Koordinaten', a.koordinaten, koordinatenLink(a.koordinaten), true)}
      ${kv('Region', a.region)}
      ${kv('Anlagenlieferant', a.anlagenlieferant)}
      ${kv('Anlagentyp', a.anlagentyp)}
      ${kv('Grösse Anlage', a.groesse)}
      ${kv('EWS / EWP', [a.ews,a.ewp].filter(Boolean).join(' / '))}
      ${kv('Anzahl Service/Jahr', a.anzahlService)}
      ${kv('Kompressor-Typ', a.komprTyp)}
      ${kv('GWA-Nr.', a.gwaNr)}
      ${kv('Inbetriebnahme (IBS)', a.ibs)}
      ${kv('Vertrag ab', a.vertragAb)}
      ${kv('Letzter Service', a.letzterService)}
      ${kv('Nächster Service', a.naechsterService)}
      ${kv('Dauer (Min)', a.dauer)}
      ${kv('Filtersack', a.filtersack)}
    </div>
  `;

  const pl = k.planung || {};
  const service1Val = combinedDatumZeit(pl.datS, pl.zeitS);
  const service2Val = combinedDatumZeit(pl.dat226, pl.zeit226);
  const sameService = service1Val && service2Val && pl.datS === pl.dat226 && pl.zeitS === pl.zeit226;
  const tagPrefix = pl.tag ? pl.tag + ', ' : '';
  const service1 = service1Val ? tagPrefix + service1Val : null;
  const service2 = service2Val ? tagPrefix + service2Val : null;
  const service1Label = '1. Service' + (formatDatumJahr(pl.datS) ? ' ' + formatDatumJahr(pl.datS) : '');
  const service2Label = '2. Service' + (formatDatumJahr(pl.dat226) ? ' ' + formatDatumJahr(pl.dat226) : '');
  const serviceLabel = sameService ? 'Service' + (formatDatumJahr(pl.datS) ? ' ' + formatDatumJahr(pl.datS) : '') : service1Label;
  const planungCard = `
    <div class="card">
      <h3>Planung / Tour</h3>
      ${kv('Kontrolle Planung', pl.kontrollePlanung)}
      ${kv(serviceLabel, service1)}
      ${sameService ? '' : kv(service2Label, service2)}
      ${kv('Zuständiger Kanton', pl.zustKt)}
    </div>
  `;

  const kontakte = k.kontakte || {};
  const kontaktTabs = [
    ['betreiber', 'Betreiber'],
    ['eigentuemer', 'Eigentümer'],
    ['rechnung', 'Rechnung'],
    ['avisierung', 'Avisierung'],
  ];
  const kontaktCard = `
    <div class="card">
      <div class="tabs" id="kontakt-tabs">
        ${kontaktTabs.map(([key,label], i) => `<button class="tab-btn${i===0?' active':''}" data-tab="${key}">${label}</button>`).join('')}
      </div>
      <div id="kontakt-tab-body">${contactTabBody('betreiber', kontakte.betreiber)}</div>
    </div>
  `;

  // Wenn 1. und 2. Service im selben Jahr auf Datum+Zeit identisch sind, zu einer Zeile zusammenfassen
  const termineRaw = (k.termine||[]).filter(t => t.datum || t.zeit);
  const termineByJahr = {};
  termineRaw.forEach(t => {
    termineByJahr[t.jahr] = termineByJahr[t.jahr] || [];
    termineByJahr[t.jahr].push(t);
  });
  const termine = [];
  Object.keys(termineByJahr).forEach(jahr => {
    const entries = termineByJahr[jahr];
    const e1 = entries.find(t => t.halbjahr === '1');
    const e2 = entries.find(t => t.halbjahr === '2');
    if(e1 && e2 && e1.datum === e2.datum && e1.zeit === e2.zeit){
      termine.push({ jahr, halbjahr: null, datum: e1.datum, zeit: e1.zeit });
    } else {
      entries.forEach(t => termine.push(t));
    }
  });
  termine.sort((a,b) => (a.jahr + (a.halbjahr||'0')).localeCompare(b.jahr + (b.halbjahr||'0')));
  termine.reverse();
  const termineCard = `
    <div class="card">
      <h3>Service-Termine</h3>
      ${termine.length ? `<ul class="timeline">
        ${termine.map(t => `<li><span class="tdot"></span><span class="tlabel">${t.halbjahr ? t.halbjahr+'. Service' : 'Service'} ${escapeHtml(t.jahr)}</span><span class="tval">${escapeHtml(t.datum||'—')}${t.zeit?(' · '+escapeHtml(formatZeit(t.zeit))+' Uhr'):''}</span></li>`).join('')}
      </ul>` : '<div class="kv"><span class="k">Keine Termine erfasst</span></div>'}
    </div>
  `;

  const bem = k.bemerkungen || {};
  const bemEntries = [
    ['Büro', bem.buero],
    ['Intern', bem.intern],
    ['Planung', bem.planung],
    ['Besonderes', bem.besonderes],
    ['Ersatzteile', bem.ersatzteile],
    ['Ersatzteile (alt)', bem.ersatzteileAlt],
    ...(bem.weitere || []).map(w => [w.label, w.value]),
  ].filter(([,v]) => v);
  const bemCard = `
    <div class="card">
      <h3>Bemerkungen</h3>
      ${bemEntries.length ? bemEntries.map(([label,val]) => `
        <div class="remark"><div class="rlabel">${escapeHtml(label)}</div>${escapeHtml(val)}</div>
      `).join('') : '<div class="kv"><span class="k">Keine Bemerkungen</span></div>'}
    </div>
  `;

  const raw = k.rohdaten || {};
  const rawGrid = Object.keys(raw).map(key => {
    const v = raw[key];
    if(v===null || v===undefined || v==='' ) return '';
    return `<div class="raw-cell"><span class="rk">${escapeHtml(key)}</span><span class="rv">${escapeHtml(v)}</span></div>`;
  }).join('');
  const rawCard = `
    <details class="raw">
      <summary>Alle Original-Felder anzeigen (Rohdaten)</summary>
      <div class="raw-grid">${rawGrid}</div>
    </details>
  `;

  $('#detail-panel').innerHTML = `
    ${header}
    <div class="grid">${anlageCard}${planungCard}</div>
    ${kontaktCard}
    ${termineCard}
    ${bemCard}
    ${rawCard}
  `;

  // Tab-Wechsel für Kontakte verdrahten
  const tabsEl = document.getElementById('kontakt-tabs');
  if(tabsEl){
    tabsEl.querySelectorAll('.tab-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        tabsEl.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        const key = btn.dataset.tab;
        document.getElementById('kontakt-tab-body').innerHTML = contactTabBody(key, kontakte[key]);
      });
    });
  }

  const tagestourBtn = document.getElementById('chip-tagestour');
  if(tagestourBtn){
    tagestourBtn.addEventListener('click', () => {
      openTagestour(tagestourBtn.dataset.datum, tagestourBtn.dataset.fahrer);
    });
  }
}

function kv(label, value, mono){
  if(value===null || value===undefined || value==='') return '';
  return `<div class="kv"><span class="k">${escapeHtml(label)}</span><span class="v${mono?' mono':''}">${escapeHtml(value)}</span></div>`;
}

function kvLink(label, value, href, mono){
  if(value===null || value===undefined || value==='') return '';
  if(!href) return kv(label, value, mono);
  return `<div class="kv"><span class="k">${escapeHtml(label)}</span><a class="v link${mono?' mono':''}" href="${href}" target="_blank" rel="noopener">${escapeHtml(value)}</a></div>`;
}

async function ladeRoute(datum, fahrer){
  const rs = document.getElementById('route-summary');
  if(!rs) return;
  try{
    const r = await fetch('/api/route/' + encodeURIComponent(datum) + '/' + encodeURIComponent(fahrer));
    const d = await r.json();
    const rsAktuell = document.getElementById('route-summary');
    if(!rsAktuell) return; // Modal inzwischen geschlossen/gewechselt

    if(d.error){
      rsAktuell.innerHTML = `Route konnte nicht berechnet werden (${escapeHtml(d.error)})`;
      return;
    }
    if(d.km === null){
      rsAktuell.innerHTML = d.hinweis ? escapeHtml(d.hinweis) : 'Route nicht verfügbar.';
      return;
    }
    const std = Math.floor(d.dauerMinuten / 60);
    const min = d.dauerMinuten % 60;
    const dauerText = std > 0 ? `${std} Std ${min} Min` : `${min} Min`;
    let text = `Fahrstrecke: <strong>${d.km.toLocaleString('de-CH')} km</strong> · Fahrzeit: <strong>${dauerText}</strong>`;
    if(d.fehlendeKoordinaten > 0){
      text += ` <span class="route-hinweis">(${d.fehlendeKoordinaten} Stopp${d.fehlendeKoordinaten>1?'s':''} ohne Koordinaten nicht berücksichtigt)</span>`;
    }
    rsAktuell.innerHTML = text;
  }catch(err){
    const rsAktuell = document.getElementById('route-summary');
    if(rsAktuell) rsAktuell.innerHTML = 'Route konnte nicht berechnet werden.';
  }
}

async function openTagestour(datum, fahrer){
  const overlay = $('#tagestour-overlay');
  $('#tagestour-title').textContent = 'Tagestour · ' + datum + (fahrer ? ' · ' + fahrer : '');
  $('#tagestour-body').innerHTML = '<div class="modal-empty">Lade…</div>';
  overlay.classList.add('open');

  try{
    const r = await fetch('/api/tagestour/' + encodeURIComponent(datum));
    const d = await r.json();
    let liste = d.kunden || [];
    // Nur den gleichen Fahrer (gleiches Fahrzeug) anzeigen
    if(fahrer){
      liste = liste.filter(t => t.fahrer === fahrer);
    }
    if(!liste.length){
      $('#tagestour-body').innerHTML = '<div class="modal-empty">Keine weiteren Termine an diesem Tag gefunden.</div>';
      return;
    }
    $('#tagestour-body').innerHTML = liste.map(t => {
      const isSelf = t.kdnr === activeKdnr;
      return `
        <div class="tour-item${isSelf ? ' self' : ''}" data-kdnr="${escapeHtml(t.kdnr)}">
          <span class="tour-zeit">${t.zeit ? escapeHtml(formatZeit(t.zeit)) : '—'}</span>
          <span class="tour-info">
            <div class="tour-name">${escapeHtml(t.kdnrName || ('#'+t.kdnr))}</div>
            ${t.ort ? `<div class="tour-ort">${escapeHtml(t.ort)}</div>` : ''}
          </span>
          ${t.fahrer ? `<span class="tour-fahrer ${t.fahrer === 'Ralph' ? 'ralph' : 'kathrin'}">${escapeHtml(t.fahrer)}</span>` : ''}
          ${isSelf ? '<span class="tour-badge">Aktuell</span>' : ''}
        </div>
      `;
    }).join('') + '<div class="route-summary" id="route-summary">Route wird berechnet…</div>';
    $('#tagestour-body').querySelectorAll('.tour-item').forEach(el => {
      el.addEventListener('click', () => {
        closeTagestour();
        openKunde(el.dataset.kdnr);
      });
    });

    if(fahrer){
      ladeRoute(datum, fahrer);
    } else {
      const rs = document.getElementById('route-summary');
      if(rs) rs.remove();
    }
  }catch(err){
    $('#tagestour-body').innerHTML = '<div class="modal-empty">Fehler beim Laden.</div>';
  }
}

async function openEinsatztage(){
  const overlay = $('#tage-overlay');
  $('#tage-title').textContent = 'Einsatztage';
  $('#tage-body').innerHTML = '<div class="modal-empty">Lade…</div>';
  overlay.classList.add('open');

  try{
    const r = await fetch('/api/tage');
    const d = await r.json();
    const tage = d.tage || [];
    const heute = new Date(); heute.setHours(0,0,0,0);

    const kommend = tage.filter(t => { const dd = parseDatum(t.datum); return dd && dd.getTime() >= heute.getTime(); });
    const vergangen = tage.filter(t => { const dd = parseDatum(t.datum); return dd && dd.getTime() < heute.getTime(); });

    if(!tage.length){
      $('#tage-body').innerHTML = `<div class="modal-empty">Keine Einsatztage für ${d.jahr} gefunden.</div>`;
      return;
    }

    const renderTag = (t) => {
      const hatRalph = t.ralph > 0;
      const hatKathrin = t.kathrin > 0;
      const badges = [
        hatKathrin ? '<span class="tage-fahrer k">K</span>' : '',
        hatRalph ? '<span class="tage-fahrer r">R</span>' : '',
      ].join('');
      return `
        <div class="tage-item" data-datum="${escapeHtml(t.datum)}" data-ralph="${hatRalph ? 1 : 0}" data-kathrin="${hatKathrin ? 1 : 0}">
          <span class="tage-datum">${escapeHtml(t.datum)}</span>
          <span class="tage-fahrer-group">${badges}</span>
          <span class="tage-count">${t.ralph + t.kathrin + t.sonst} Kunden</span>
        </div>
      `;
    };

    let html = '';
    if(kommend.length){
      html += `<div class="tage-section-title">Ab heute</div>` + kommend.map(renderTag).join('');
    }
    if(vergangen.length){
      html += `<div class="tage-section-title">Vergangen (${d.jahr})</div>` + vergangen.map(renderTag).join('');
    }
    const totalServicetage = tage.reduce((sum, t) => sum + (t.ralph > 0 ? 1 : 0) + (t.kathrin > 0 ? 1 : 0), 0);
    html += `<div class="tage-summary">Total Servicetage ${d.jahr}: <strong>${totalServicetage}</strong></div>`;
    $('#tage-body').innerHTML = html;

    $('#tage-body').querySelectorAll('.tage-item').forEach(el => {
      el.addEventListener('click', () => {
        const datum = el.dataset.datum;
        const hatRalph = el.dataset.ralph === '1';
        const hatKathrin = el.dataset.kathrin === '1';
        if(hatRalph && hatKathrin){
          showFahrerWahl(datum);
        } else {
          const fahrer = hatRalph ? 'Ralph' : (hatKathrin ? 'Kathrin' : '');
          closeTage();
          openTagestour(datum, fahrer);
        }
      });
    });
  }catch(err){
    $('#tage-body').innerHTML = '<div class="modal-empty">Fehler beim Laden.</div>';
  }
}
